<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-labelledby="title">
  <title id="title">Practice Planner</title>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc"/>
      <stop offset="100%" style="stop-color:#e2e8f0"/>
    </linearGradient>
  </defs>
  <rect width="320" height="200" rx="16" fill="url(#bg)"/>
  <!-- Clipboard -->
  <rect x="48" y="28" width="88" height="112" rx="8" fill="#1e3a5f" stroke="#0f172a" stroke-width="2"/>
  <rect x="72" y="22" width="40" height="14" rx="4" fill="#f59e0b" stroke="#b45309" stroke-width="1"/>
  <rect x="58" y="44" width="68" height="88" rx="4" fill="#fff" stroke="#cbd5e1" stroke-width="1"/>
  <path d="M68 58h48M68 72h40M68 86h44" stroke="#22c55e" stroke-width="3" stroke-linecap="round"/>
  <path d="M66 58l4 4 8-10M66 72l4 4 8-10M66 86l4 4 8-10" fill="none" stroke="#22c55e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Stopwatch -->
  <circle cx="200" cy="118" r="36" fill="#1e3a5f" stroke="#0f172a" stroke-width="2"/>
  <circle cx="200" cy="118" r="28" fill="#fff" stroke="#94a3b8" stroke-width="1"/>
  <line x1="200" y1="118" x2="200" y2="98" stroke="#dc2626" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="200" y1="118" x2="214" y2="126" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
  <rect x="196" y="76" width="8" height="12" rx="2" fill="#f59e0b"/>
  <!-- Baseball -->
  <circle cx="118" cy="152" r="14" fill="#fff" stroke="#0f172a" stroke-width="2"/>
  <path d="M108 148q10 8 20 0M110 156q10-8 20 0" stroke="#dc2626" stroke-width="1.5" fill="none"/>
  <!-- Golf ball -->
  <circle cx="158" cy="154" r="10" fill="#fff" stroke="#64748b" stroke-width="1.5"/>
  <circle cx="156" cy="152" r="1.2" fill="#94a3b8"/><circle cx="160" cy="150" r="1" fill="#94a3b8"/><circle cx="159" cy="156" r="0.9" fill="#94a3b8"/>
  <!-- Wordmark -->
  <text x="160" y="188" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="22" font-weight="800" font-style="italic" fill="#0f172a">Practice Planner</text>
</svg>
